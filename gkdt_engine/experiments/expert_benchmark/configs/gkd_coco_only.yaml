    DROP_LAST: True
  EPISODE_TYPE: 'one_class'  # "one_class", "mix_class"
  PAD_KPS:
    NUM_AT_TRAIN: 80  # Pad num of kps for parallel large-scale training
    SAME_AT_TEST: True  # If True, padding as well when kps num < NUM_AT_TRAIN; if false, no padding at test/val. No matter if padding or not, it can be any num in testing/val.
