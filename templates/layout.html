<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Zero2YoloYard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .system-status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 26px;
            background-color: var(--bg-glass);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            z-index: 9999;
        }

        .status-item {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background-color: var(--color-success);
            margin-right: 8px;
            border-radius: 50%;
            box-shadow: 0 0 8px var(--color-success);
        }

        main {
            padding-bottom: 40px;
        }

        .feed-alert { opacity: 0.8; }

        /* Navbar Brand Hover Animation */
        .navbar-brand-icon {
            font-size: 1.4rem;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
        }
        .navbar-brand:hover .navbar-brand-icon {
            transform: rotate(90deg) scale(1.1);
            color: #ffffff !important;
        }

        /* ==================== SYSTEM INITIALIZATION SPLASH ==================== */
        .telemetry-splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-body); z-index: 999999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
        }
        .telemetry-splash-screen.boot-complete {
            opacity: 0; 
            visibility: hidden;
            pointer-events: none;
        }
        .splash-center {
            width: 360px; display: flex; flex-direction: column; align-items: center; text-align: center;
            position: relative;
        }
        .splash-logo-glow {
            position: absolute;
            top: -40px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: pulseGlow 3s infinite ease-in-out;
        }
        .splash-icon {
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 12px;
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .splash-title {
            font-family: 'Inter', sans-serif; font-size: 1.5rem; font-weight: 700;
            color: var(--text-main); margin-bottom: 4px; letter-spacing: -0.02em;
        }
        .splash-subtitle {
            font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
            color: var(--text-secondary); margin-bottom: 24px;
        }
        .splash-bar-container {
            width: 100%; height: 3px; background: rgba(255, 255, 255, 0.08);
            position: relative; overflow: hidden; border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        .splash-bar-fill {
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, #567594, #e4e4e7, #ffffff);
            transition: width 0.15s linear;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .splash-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 10px;
            letter-spacing: 0.05em;
        }

        /* Toast Container & Animated Notifications */
        #sys-toast-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sys-toast {
            background: rgba(18, 18, 21, 0.92);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--color-primary);
            color: var(--text-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 15px rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-sm);
            animation: toastSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
            min-width: 280px;
        }

        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateX(40px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        .sys-toast.toast-error { border-left-color: var(--color-danger); }
        .sys-toast.toast-success { border-left-color: var(--color-success); }
        .sys-toast.toast-warning { border-left-color: var(--color-warning); }
        .sys-toast.toast-info { border-left-color: var(--color-info); }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <div id="telemetry-splash" class="telemetry-splash-screen">
        <div class="splash-logo-glow"></div>
        <div class="splash-center">
            <i class="bi bi-bounding-box splash-icon"></i>
            <div class="splash-title">
                <span>Zero2YoloYard</span>
            </div>
            <div class="splash-subtitle">AI Annotation & Model Operations Yard</div>
            <div class="splash-bar-container">
                <div id="splash-bar" class="splash-bar-fill"></div>
            </div>
            <div id="splash-status-text" class="splash-status">LOADING SYSTEM TELEMETRY...</div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark py-2 px-4 border-bottom">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <i class="bi bi-bounding-box text-light mr-3 navbar-brand-icon" style="opacity: 0.9;"></i>
            <div class="d-flex flex-column justify-content-center">
                <span class="font-weight-bold" style="font-family: 'Inter', sans-serif; letter-spacing: -0.01em; line-height: 1.2; font-size: 1.15rem;">Zero2YoloYard</span>
                <span class="small text-muted" style="font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;">by BlueDarkUP</span>
            </div>
        </a>

        <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav mr-auto"></ul>

            <div class="d-flex align-items-center text-right">
                <div class="d-none d-md-block mr-4 text-right">
                    <div class="small text-muted font-monospace" style="font-size: 0.7rem;">BE BASED ON FMLTC</div>
                    <div class="small text-success font-monospace d-flex align-items-center justify-content-end" style="font-size: 0.65rem; gap: 4px;">
                        <span class="status-indicator"></span> Connected
                    </div>
                </div>
                <i class="bi bi-broadcast text-secondary" title="LIVE FEED"></i>
            </div>
        </div>
    </nav>

    <main role="main" class="flex-grow-1 position-relative">
        {% block content %}{% endblock %}
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <script>
        // ==================== BOOT SEQUENCE LOGIC ====================
        document.addEventListener("DOMContentLoaded", () => {
            const splash = document.getElementById("telemetry-splash");
            if (!splash) return;

            const serverBootId = "{{ server_boot_id | default('fallback') }}";
            const savedBootId = localStorage.getItem("z2y_last_boot_id");

            if (serverBootId !== 'fallback' && savedBootId === serverBootId) {
                splash.style.display = 'none';
                splash.remove();
                return;
            }

            document.body.style.overflow = "hidden";

            const barFill = document.getElementById("splash-bar");
            const statusText = document.getElementById("splash-status-text");
            const steps = ["INITIALIZING SUBSYSTEMS...", "LOADING NEURAL PIPELINES...", "VERIFYING HARDWARE SPECS...", "SYSTEM READY"];
            let progress = 0;
            let stepIdx = 0;

            const bootInterval = setInterval(() => {
                progress += Math.random() * 12 + 8;
                if (progress >= 100) progress = 100;

                if (barFill) barFill.style.width = progress + "%";
                
                if (statusText) {
                    stepIdx = Math.min(Math.floor((progress / 100) * steps.length), steps.length - 1);
                    statusText.innerText = steps[stepIdx];
                }

                if (progress === 100) {
                    clearInterval(bootInterval);

                    if (serverBootId !== 'fallback') {
                        localStorage.setItem("z2y_last_boot_id", serverBootId);
                    }

                    setTimeout(() => {
                        splash.classList.add("boot-complete");
                        document.body.style.overflow = "auto";
                        setTimeout(() => splash.remove(), 400);
                    }, 250);
                }
            }, 40);
        });

        setInterval(() => {
            const latency = Math.floor(Math.random() * (18 - 8 + 1)) + 8;
            const memory = (40 + Math.random() * 5).toFixed(1);
            const sysLatencyEl = document.getElementById('sys-latency');
            const sysMemoryEl = document.getElementById('sys-memory');
            if(sysLatencyEl) sysLatencyEl.innerText = latency + 'ms';
            if(sysMemoryEl) sysMemoryEl.innerText = memory + '%';
        }, 2000);
    </script>

    <div class="modal fade scale-in" id="sysConfirmModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-body text-center pt-4 pb-3">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 2rem;"></i>
                    <p id="sysConfirmMessage" class="mt-3 font-weight-medium text-main small"></p>
                </div>
                <div class="modal-footer border-0 justify-content-center pb-4 pt-0">
                    <button type="button" class="btn btn-sm btn-outline-secondary px-3" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-sm btn-danger px-3" id="sysConfirmBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade scale-in" id="sysPromptModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0 pt-3 px-4">
                    <h6 id="sysPromptTitle" class="modal-title font-weight-bold text-main text-uppercase">
                        <i class="bi bi-pencil mr-2"></i> Edit Prompt
                    </h6>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close" style="text-shadow: none; opacity: 0.7; outline: none;">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-left py-2 px-4">
                    <p id="sysPromptMessage" class="text-muted small mb-2" style="font-size: 0.8rem;">
                        Enter text description:
                    </p>
                    <input type="text" id="sysPromptInput" class="form-control form-control-sm tool-input mb-2" placeholder="e.g. 'a red plastic ball'...">
                </div>
                <div class="modal-footer border-0 justify-content-end pb-3 pt-2 px-4">
                    <button type="button" class="btn btn-sm btn-outline-secondary px-3" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-sm btn-primary font-weight-bold px-3" id="sysPromptBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div aria-live="polite" aria-atomic="true" style="position: fixed; top: 75px; right: 24px; z-index: 99999;">
        <div id="sys-toast-container"></div>
    </div>

    <script>
        window.sysAlert = function(message, type = 'success') {
            const toastId = 'toast-' + Date.now() + Math.floor(Math.random() * 1000);
            const title = type === 'error' ? 'SYS_ERROR' : (type === 'warning' ? 'SYS_WARNING' : 'SYS_NOTICE');
            const icon = type === 'error' ? 'bi-x-octagon-fill text-danger' : (type === 'warning' ? 'bi-exclamation-circle-fill text-warning' : 'bi-check-circle-fill text-success');
            const toastClass = type === 'error' ? 'toast-error' : (type === 'warning' ? 'toast-warning' : 'toast-success');

            const toastHtml = `
                <div id="${toastId}" class="toast sys-toast ${toastClass} mb-2" role="alert" aria-live="assertive" aria-atomic="true" data-delay="${type === 'error' ? '5000' : '3200'}">
                    <div class="toast-header border-0 bg-transparent text-white pb-0 pt-2 px-3">
                        <i class="bi ${icon} mr-2"></i>
                        <strong class="mr-auto font-monospace small tracking-wider">${title}</strong>
                        <button type="button" class="ml-2 mb-1 close text-white" data-dismiss="toast" style="text-shadow: none; opacity: 0.8; outline: none;">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="toast-body font-monospace small pt-1 pb-2 px-3 text-muted">
                        > ${message}
                    </div>
                </div>`;

            $('#sys-toast-container').append(toastHtml);
            $('#' + toastId).toast('show');
            $('#' + toastId).on('hidden.bs.toast', function () { $(this).remove(); });
        };

        window.sysConfirm = function(message, callback) {
            $('#sysConfirmMessage').text(message);
            $('#sysConfirmModal').modal('show');
            $('#sysConfirmBtn').off('click').on('click', function() {
                if (callback) {
                    $('#sysConfirmModal').one('hidden.bs.modal', function() {
                        callback();
                    });
                }
                $('#sysConfirmModal').modal('hide');
            });
        };

        window.sysPrompt = function(options, callback) {
            let title = "EDIT PROMPT";
            let message = "Enter text description:";
            let defaultValue = "";

            if (typeof options === 'object') {
                title = options.title || title;
                message = options.message || message;
                defaultValue = options.defaultValue || "";
            } else if (typeof options === 'string') {
                title = options;
                if (typeof arguments[1] === 'function') {
                    callback = arguments[1];
                } else {
                    defaultValue = arguments[1] || "";
                    callback = arguments[2];
                }
            }

            $('#sysPromptTitle').html(`<i class="bi bi-cpu mr-2"></i> ${title}`);
            $('#sysPromptMessage').text('> ' + message);
            $('#sysPromptInput').val(defaultValue);

            $('#sysPromptModal').modal('show');
            $('#sysPromptModal').one('shown.bs.modal', function() {
                $('#sysPromptInput').focus().select();
            });

            $('#sysPromptBtn').off('click').on('click', function() {
                const val = $('#sysPromptInput').val();
                if (callback) {
                    $('#sysPromptModal').one('hidden.bs.modal', function() {
                        callback(val);
                    });
                }
                $('#sysPromptModal').modal('hide');
            });

            $('#sysPromptInput').off('keyup').on('keyup', function(e) {
                if (e.key === 'Enter') {
                    $('#sysPromptBtn').click();
                }
            });
        };

        $(document).on('show.bs.modal', '.modal', function () {
            const openCount = $('.modal.show').length;
            const newZ = 1050 + openCount * 20;
            $(this).css('z-index', newZ);
            setTimeout(function () {
                const $backdrop = $('.modal-backdrop').last();
                $backdrop.css('z-index', newZ - 10);
            }, 10);
        });

        $(document).on('hidden.bs.modal', '.modal', function () {
            if ($('.modal.show').length > 0) {
                $('body').addClass('modal-open');
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
