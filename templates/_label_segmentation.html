<!-- Instance/Semantic Segmentation (Polygon) Sidebar Sub-Template -->
<div class="task-panel task-segmentation">
    {% include '_label_inference_tools.html' %}

    <div class="d-flex justify-content-between align-items-center mb-2 mt-3">
        <h6 class="font-weight-bold text-uppercase text-info mb-0">
            <i class="bi bi-bezier2 mr-1"></i> Polygons (<span id="segmentation-count">0</span>)
        </h6>
        <button id="btn-complete-polygon" class="btn btn-sm btn-outline-success font-weight-bold" style="display:none;">
            <i class="bi bi-check-lg mr-1"></i>Close Shape (Enter)
        </button>
    </div>

    <div class="alert alert-dark p-2 small mb-3 border-secondary text-muted" style="font-size: 0.75rem;">
        <i class="bi bi-info-circle mr-1"></i><b>Manual</b>: Click to add vertices. Right-click / Enter to close. Esc to cancel.<br>
        <i class="bi bi-info-circle mr-1"></i><b>Brush/Eraser</b>: Paint pixels freehand; auto-converts to Polygon.
    </div>

    <!-- Phase 2: Brush / Eraser Tool Controls -->
    <div class="brush-tools-panel p-2 mb-3 border border-secondary rounded" style="background: rgba(255,255,255,0.03);">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small font-weight-bold text-uppercase text-light"><i class="bi bi-paint-bucket mr-1"></i> Paint Tools</span>
            <div>
                <button id="btn-brush-tool" class="btn btn-xs btn-outline-info mr-1" title="Brush (Freehand Paint)">
                    <i class="bi bi-brush"></i> Brush
                </button>
                <button id="btn-eraser-tool" class="btn btn-xs btn-outline-danger" title="Eraser (Subtract Area)">
                    <i class="bi bi-eraser"></i> Eraser
                </button>
            </div>
        </div>
        <div id="brush-size-controls" class="mt-2" style="display:none;">
            <div class="d-flex justify-content-between small text-muted mb-1">
                <span>Brush Size</span>
                <span id="brush-size-val" class="font-weight-bold text-info">15px</span>
            </div>
            <input type="range" class="custom-range" id="brush-size-slider" min="3" max="60" value="15">
        </div>
    </div>

    <div id="segmentation-object-list" class="annotation-object-list">
        <!-- Dynamically rendered Polygon items -->
    </div>
</div>
