<!-- Image Classification Sidebar Sub-Template -->
<div class="task-panel task-classification">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="font-weight-bold text-uppercase text-warning mb-0">
            <i class="bi bi-tags-fill mr-1"></i> Image Categories
        </h6>
        <div>
            <button id="btn-open-visual-clustering-side" class="btn btn-xs btn-outline-info mr-1" onclick="$('#btn-open-visual-clustering').click();">
                <i class="bi bi-diagram-3"></i> Cluster
            </button>
            <button id="btn-clear-classification" class="btn btn-xs btn-outline-danger" onclick="if(window.annotationCore && window.annotationCore.annotator) window.annotationCore.annotator.clearClassification();">
                <i class="bi bi-x-circle"></i> Clear
            </button>
        </div>
    </div>

    <div class="alert alert-dark p-2 small mb-3 border-secondary text-muted" style="font-size: 0.75rem;">
        <i class="bi bi-lightning-charge-fill text-warning mr-1"></i><b>1-Key Tagging</b>: Press keys <span class="badge badge-secondary">1</span> - <span class="badge badge-secondary">9</span> to tag & auto-next.<br>
        <i class="bi bi-info-circle mr-1"></i>Press <span class="badge badge-secondary">C</span> to clear tag. Click chips below to select.
    </div>

    <div class="form-group mb-3">
        <input type="text" id="classification-search" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Search categories...">
    </div>

    <div id="classification-tag-container" class="d-flex flex-wrap gap-2 mb-3">
        <!-- Dynamically rendered Category Tag Chips -->
    </div>
</div>
