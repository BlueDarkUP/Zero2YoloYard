<!-- Pose / Keypoint Skeleton Sidebar Sub-Template -->
<style>
    .pose-inline-name-input {
        position: fixed;
        z-index: 2000;
        width: 180px;
        padding: 5px 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        background: #0d0f17;
        color: #00f0ff;
        border: 1px solid #00f0ff;
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 14px rgba(0,240,255,0.4);
        outline: none;
    }
    .task-pose [data-v]:disabled { opacity: 0.35; cursor: not-allowed; }

    .pose-tool-btn {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.35rem 0.2rem;
        border-radius: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .pose-panel-box {
        background: rgba(16, 20, 30, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 10px;
        transition: all 0.2s ease-in-out;
    }
</style>

<div class="task-panel task-pose">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="font-weight-bold text-uppercase text-danger mb-0" style="letter-spacing: 0.5px;">
            <i class="bi bi-diagram-3-fill mr-2"></i>Skeletons (<span id="pose-count">0</span>)
        </h6>
    </div>

    <!-- Tool Selector Toggle Buttons (Compact Row like DET/SEG) -->
    <div class="row no-gutters mb-2" style="gap: 4px;">
        <div class="col">
            <button id="btn-show-gkdt-panel" class="btn btn-sm btn-outline-danger w-100 pose-tool-btn active" title="GKDT Interactive Click Mode">
                <i class="bi bi-crosshair"></i> GKDT
            </button>
        </div>
        <div class="col">
            <button id="btn-show-truelam-panel" class="btn btn-sm btn-outline-warning w-100 pose-tool-btn" title="TrueLAM Auto-Detection Mode">
                <i class="bi bi-lightning-fill"></i> TrueLAM
            </button>
        </div>
        <div class="col">
            <button id="btn-show-interp-panel" class="btn btn-sm btn-outline-info w-100 pose-tool-btn" title="Keypoint Linear Interpolation Mode">
                <i class="bi bi-graph-up"></i> Interp
            </button>
        </div>
    </div>

    <!-- Panel 1: GKDT Interactive (Default Shown) -->
    <div id="gkdt-panel-controls" class="pose-panel-box border border-danger">
        <div class="small font-weight-bold text-danger mb-1 d-flex justify-content-between align-items-center">
            <span><i class="bi bi-crosshair mr-1"></i>GKDT Click Mode</span>
            <span class="badge badge-danger" style="font-size: 0.6rem;">ECCV 26</span>
        </div>
        <button id="btn-toggle-gkdt-interactive" class="btn btn-sm btn-outline-danger font-weight-bold w-100 mt-1" style="font-size: 0.75rem;">
            <i class="bi bi-crosshair mr-1"></i>Enable Point-Click
        </button>
    </div>

    <!-- Panel 2: TrueLAM Auto-Detect (Hidden by Default) -->
    <div id="truelam-panel-controls" class="pose-panel-box border border-warning" style="display: none;">
        <div class="small font-weight-bold text-warning mb-1 d-flex justify-content-between align-items-center">
            <span><i class="bi bi-lightning-fill mr-1"></i>TrueLAM Pose</span>
            <span class="badge badge-warning text-dark" style="font-size: 0.6rem; font-weight: 700;">AI Auto</span>
        </div>
        <div class="input-group input-group-sm my-1">
            <input type="text" id="pose-truelam-prompt-input" class="form-control bg-dark text-light border-secondary" placeholder="Prompt (e.g. person)" style="font-size: 0.75rem;">
        </div>
        <button type="button" id="btn-truelam-pose-batch" class="btn btn-sm btn-warning font-weight-bold w-100 text-dark mt-1" style="font-size: 0.75rem;">
            <i class="bi bi-magic mr-1"></i>Detect Current Frame
        </button>
        <button type="button" id="btn-truelam-pose-dataset-batch" class="btn btn-sm btn-outline-warning font-weight-bold w-100 mt-1" style="font-size: 0.75rem;">
            <i class="bi bi-collection-play mr-1"></i>Apply to Dataset
        </button>
    </div>

    <!-- Panel 3: Keypoint Interpolation (Hidden by Default) -->
    <div id="interp-panel-controls" class="pose-panel-box border border-info" style="display: none;">
        <div class="small font-weight-bold text-info mb-1 d-flex justify-content-between align-items-center">
            <span><i class="bi bi-graph-up mr-1"></i>Keypoint Interpolation</span>
            <span class="badge badge-info text-dark" style="font-size: 0.6rem; font-weight: 700;">Linear</span>
        </div>
        <div class="d-flex mb-1" style="gap: 4px;">
            <div class="input-group input-group-sm flex-fill">
                <div class="input-group-prepend"><span class="input-group-text bg-dark text-info border-secondary" style="font-size: 0.7rem;">Start</span></div>
                <input type="number" id="pose-interp-start-frame" class="form-control bg-dark text-light border-secondary" placeholder="Frame" style="font-size: 0.75rem;">
            </div>
            <button type="button" id="btn-set-pose-interp-start" class="btn btn-sm btn-outline-info" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;">Set</button>
        </div>
        <div class="d-flex mb-2" style="gap: 4px;">
            <div class="input-group input-group-sm flex-fill">
                <div class="input-group-prepend"><span class="input-group-text bg-dark text-info border-secondary" style="font-size: 0.7rem;">End</span></div>
                <input type="number" id="pose-interp-end-frame" class="form-control bg-dark text-light border-secondary" placeholder="Frame" style="font-size: 0.75rem;">
            </div>
            <button type="button" id="btn-set-pose-interp-end" class="btn btn-sm btn-outline-info" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;">Set</button>
        </div>
        <button type="button" id="btn-exec-pose-interpolate" class="btn btn-sm btn-info font-weight-bold text-dark w-100" style="font-size: 0.75rem;">
            <i class="bi bi-arrow-down-up mr-1"></i>Execute Interpolation
        </button>
    </div>

    <!-- Manual Action Buttons -->
    <div class="d-flex mb-2" style="gap: 6px;">
        <button id="btn-add-skeleton" class="btn btn-sm btn-primary font-weight-bold flex-grow-1" style="font-size: 0.75rem;">
            <i class="bi bi-plus-lg mr-1"></i>Add Skeleton
        </button>
        <button id="btn-edit-pose-schema" class="btn btn-sm btn-outline-info font-weight-bold" title="Edit Schema">
            <i class="bi bi-pencil-square"></i>
        </button>
    </div>

    <button id="btn-finish-pose-freeform" class="btn btn-sm btn-outline-success font-weight-bold w-100 mb-2" style="display:none; font-size: 0.75rem;">
        <i class="bi bi-check-lg mr-1"></i>Finish (Enter / Right Click)
    </button>

    <!-- Keypoint Visibility Status Buttons -->
    <div class="pose-panel-box border border-secondary p-1 mb-2">
        <div class="btn-group btn-group-sm w-100" role="group">
            <button type="button" class="btn btn-outline-success py-1" data-v="2" style="font-size: 0.7rem;">🟢 Vis (2)</button>
            <button type="button" class="btn btn-outline-warning py-1" data-v="1" style="font-size: 0.7rem;">🟠 Occ (1)</button>
            <button type="button" class="btn btn-outline-danger py-1" data-v="0" style="font-size: 0.7rem;">⚪ Abs (0)</button>
        </div>
    </div>

    <!-- Skeleton Instance List -->
    <div id="pose-object-list" class="annotation-object-list">
        <!-- Dynamically rendered Skeleton items -->
    </div>
</div>
