<!-- Pose / Keypoint Skeleton Sidebar Sub-Template
     关键点数量与命名完全自由（不限定 COCO-17），详见 static/js/annotation/annotator_pose.js -->
<style>
    .pose-inline-name-input {
        position: fixed;
        z-index: 2000;
        width: 180px;
        padding: 4px 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        background: #14161f;
        color: #00f0ff;
        border: 1px solid #00f0ff;
        border-radius: 4px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6), 0 0 12px rgba(0,240,255,0.3);
        outline: none;
    }
    .task-pose [data-v]:disabled { opacity: 0.4; cursor: not-allowed; }
</style>

<div class="task-panel task-pose">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="font-weight-bold text-uppercase text-danger mb-0">
            <i class="bi bi-diagram-3-fill mr-2"></i>Skeletons (<span id="pose-count">0</span>)
        </h6>
    </div>

    <div class="alert alert-dark p-2 small mb-3 border-secondary text-muted" style="font-size: 0.75rem;">
        <i class="bi bi-info-circle mr-1"></i>选好类别后点 <b>Add Skeleton</b>，再点画布放置；或开启 <b>GKDT 智能点选</b> 极速生成独立姿态。<br>
        <i class="bi bi-info-circle mr-1"></i>点位数量与命名完全自由，不限定 17 点。
    </div>

    <!-- SAM 2.1 + GKDT 交互开关卡片 -->
    <div class="card bg-dark border-danger p-2 mb-2">
        <div class="small font-weight-bold text-danger mb-1 d-flex justify-content-between align-items-center">
            <span><i class="bi bi-stars mr-1"></i>GKDT 交互生成 (SAM 2.1 + GKDT)</span>
            <span class="badge badge-danger">ECCV 2026</span>
        </div>
        <button id="btn-toggle-gkdt-interactive" class="btn btn-sm btn-outline-danger font-weight-bold w-100">
            <i class="bi bi-crosshair mr-1"></i>开启 GKDT 智能点选模式
        </button>
    </div>

    <!-- SAM3 TrueLAM 开放文本盲扫 + GKDT 姿态生成卡片 -->
    <div class="card bg-dark border-warning p-2 mb-3">
        <div class="small font-weight-bold text-warning mb-1 d-flex justify-content-between align-items-center">
            <span><i class="bi bi-lightning-charge-fill mr-1"></i>TrueLAM 姿态盲扫 (SAM3 + GKDT)</span>
            <span class="badge badge-warning">AI 自动生成</span>
        </div>
        <div class="input-group input-group-sm mb-2">
            <div class="input-group-prepend">
                <span class="input-group-text bg-dark text-warning border-secondary"><i class="bi bi-search"></i></span>
            </div>
            <input type="text" id="pose-truelam-prompt-input" class="form-control bg-dark text-light border-secondary" placeholder="输入识别文本 (如: person, dog)" title="SAM3 开放词汇文本 Prompt">
        </div>
        <button type="button" id="btn-truelam-pose-batch" class="btn btn-sm btn-warning font-weight-bold w-100 text-dark">
            <i class="bi bi-magic mr-1"></i>TrueLAM 识别画面全量姿态
        </button>
        <button type="button" id="btn-truelam-pose-dataset-batch" class="btn btn-sm btn-outline-warning font-weight-bold w-100 mt-2" title="使用 SAM3 + GKDT 将姿态识别全自动推导应用到整套数据集所有视频帧">
            <i class="bi bi-collection-play mr-1"></i>推导姿态至【全数据集/所有视频】
        </button>
    </div>

    <!-- 关键点帧间线性插值卡片 -->
    <div class="card bg-dark border-info p-2 mb-3">
        <div class="small font-weight-bold text-info mb-1 d-flex justify-content-between align-items-center">
            <span><i class="bi bi-graph-up-arrow mr-1"></i>关键点帧间线性插值</span>
            <span class="badge badge-info">Interpolation</span>
        </div>
        <div class="d-flex mb-1" style="gap: 4px;">
            <div class="input-group input-group-sm flex-fill">
                <div class="input-group-prepend"><span class="input-group-text bg-dark text-info border-secondary">起</span></div>
                <input type="number" id="pose-interp-start-frame" class="form-control bg-dark text-light border-secondary" placeholder="起始帧">
            </div>
            <button type="button" id="btn-set-pose-interp-start" class="btn btn-sm btn-outline-info" title="设当前帧为起始帧">📍设起</button>
        </div>
        <div class="d-flex mb-2" style="gap: 4px;">
            <div class="input-group input-group-sm flex-fill">
                <div class="input-group-prepend"><span class="input-group-text bg-dark text-info border-secondary">终</span></div>
                <input type="number" id="pose-interp-end-frame" class="form-control bg-dark text-light border-secondary" placeholder="结束帧">
            </div>
            <button type="button" id="btn-set-pose-interp-end" class="btn btn-sm btn-outline-info" title="设当前帧为结束帧">📍设终</button>
        </div>
        <button type="button" id="btn-exec-pose-interpolate" class="btn btn-sm btn-info font-weight-bold text-dark w-100">
            <i class="bi bi-arrow-down-up mr-1"></i>执行关键点线性插值
        </button>
    </div>

    <div class="d-flex mb-2" style="gap: 6px;">
        <button id="btn-add-skeleton" class="btn btn-sm btn-primary font-weight-bold flex-grow-1">
            <i class="bi bi-plus-lg mr-1"></i>Add Skeleton
        </button>
        <button id="btn-edit-pose-schema" class="btn btn-sm btn-outline-info font-weight-bold" title="编辑当前类别的点位模板（可选）">
            <i class="bi bi-pencil-square"></i>
        </button>
    </div>

    <button id="btn-finish-pose-freeform" class="btn btn-sm btn-outline-success font-weight-bold w-100 mb-2" style="display:none;">
        <i class="bi bi-check-lg mr-1"></i>完成骨架 (Enter / 右键)
    </button>


    <div class="card bg-dark border-secondary p-2 mb-3">
        <div class="small font-weight-bold text-muted mb-2">选中关键点的可见性：</div>
        <div class="btn-group btn-group-sm w-100" role="group">
            <button type="button" class="btn btn-outline-success" data-v="2" title="Visible (按键 2)">🟢 Visible</button>
            <button type="button" class="btn btn-outline-warning" data-v="1" title="Occluded (按键 1)">🟠 Occluded</button>
            <button type="button" class="btn btn-outline-danger" data-v="0" title="Absent (按键 0)">⚪ Absent</button>
        </div>
    </div>

    <div id="pose-object-list" class="annotation-object-list">
        <!-- Dynamically rendered Skeleton items -->
    </div>
</div>
